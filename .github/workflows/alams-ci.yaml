name: alams-vm-deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  provider:
    runs-on: ubuntu-latest
    environment: alams-vm-deploy
    outputs:
      vm-ip: ${{ steps.tf_output.vm-ip}}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
            creds: ${{ secrets.SUBSCRIPTION_CREDENTIALS}}
      - uses: hashicorp/setup-terraform@v3

      - name: for ssh key
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
            echo "${{ secrets.SSH_PRIVATE_KEY }}" >~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

      - name: terraform init
        run: terraform init
               
      - name: terraform fmt
        run: terraform fmt -check
            
      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.SUBSCRIPTION_ID }}" \
            -out=alams.tfplan
                

      - name: terraform apply
        run: terraform apply -auto-approve

  configure:
    needs: provider
    runs-on: ubuntu-latest
    steps:
      - name: ssh into the vm with private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: wait for the vm to be ready
        run: |
                for i in (seq 110); do
                  ssh -o StrictHostkeychecking=no -i ~/.ssh/id_rsa \
                  alams404@${{ needs.provider.outputs.vm-ip }} echo ready && break
                  echo "vm is not ready yet, wait 15 seconds..."
                  sleep 15
                  done

      - name: run the script on the vm
        run: |
              ssh -o StrictHostkeychecking=no -i ~/.ssh/id_rsa alams404@${{ needs.provider.outputs.vm-ip }} "
                sudo apt update && sudo apt upgade -y
                sudo apt install nginx -y
                cd /var/www/html
                sudo rm -f index.nginx-debian.html
                sudo git clone https://github.com/pro-prodipto/Netflix-Website-Project.git .
                sudo systemctl restart nginx
              "
      - name: show when site is live
        run: |
                echo "site is live" >>&2 GITHUB_STEP_SUMMARY





